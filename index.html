<div id="app"></div>
<style>
  :root{
    --bg:#F7F8FC; --panel:#FFFFFF; --ink:#1A1D2E; --muted:#6B7280; --line:#DDE1EE;
    --accent:#1B3A8C; --accent-soft:#EEF1FA; --warn:#B5501F; --warn-soft:#F6E7DE;
    --navy-dark:#0F2260; --gold:#FFC82D;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  #app{font-family:var(--sans);color:var(--ink);background:var(--bg);max-width:960px;margin:0 auto;}
  .topbar{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 20px;gap:14px;position:relative;overflow:hidden;}
  .topbar .left{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
  .topbar .logo{height:40px;width:auto;display:block;flex-shrink:0;}
  .topbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-0.01em;color:var(--ink);}
  .topbar .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  .gear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--sans);position:relative;z-index:1;}
  .gear:hover{border-color:var(--accent);color:var(--accent);}

  .flow{display:flex;align-items:center;gap:0;margin:20px 4px;}
  .flownode{flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;transition:all .15s;}
  .flownode.active{border-color:var(--accent);background:var(--accent-soft);}
  .flownode .num{width:22px;height:22px;border-radius:50%;background:var(--muted);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .flownode.active .num{background:var(--accent);}
  .flownode .label{font-size:13.5px;font-weight:600;}
  .flownode .desc{font-size:11px;color:var(--muted);margin-top:1px;}
  .flowline{width:28px;height:1px;background:var(--line);flex-shrink:0;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;margin:0 4px 40px;}
  .section{margin-bottom:26px;}
  .section:last-child{margin-bottom:0;}
  .section h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink);}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400;display:block;margin-top:3px;}
  .field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--sans);color:var(--ink);background:#fff;
  }
  .field input:disabled{background:#F0F2F1;color:var(--muted);}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .field textarea{min-height:52px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .jobkey input{font-family:var(--mono);}

  .checkgroup{display:flex;flex-wrap:wrap;gap:10px 18px;}
  .checkitem{display:flex;align-items:center;gap:6px;font-size:12.5px;}
  .checkitem input{width:auto;}
  .yesno-group{display:flex;gap:8px;}
  .yesno-btn{padding:8px 22px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--sans);}
  .yesno-btn:hover{border-color:var(--accent);color:var(--accent);}
  .yesno-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .money-wrap{position:relative;}
  .money-wrap .money-prefix{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none;}
  .field .money-wrap input[type=text]{padding-left:22px;}
  .audience-name-input{background:var(--accent-soft) !important;border:1px solid var(--accent) !important;border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--sans);color:var(--ink);font-weight:700;width:100%;}
  .audience-name-input:focus{background:#fff !important;outline:2px solid var(--accent);outline-offset:0;}
  .job-id-preview{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:9px 12px;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);}
  .audience-summary{padding:12px 16px;}
  .audience-summary-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .audience-summary-name{font-weight:700;font-size:13.5px;}
  .audience-summary-desc{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .audience-summary-actions{display:flex;gap:8px;flex-shrink:0;}
  .job-search-results{margin-top:8px;border:1px solid var(--line);border-radius:8px;max-height:280px;overflow-y:auto;}
  .job-search-empty{padding:14px 16px;font-size:12.5px;color:var(--muted);}
  .job-search-row{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .job-search-row:last-child{border-bottom:none;}
  .job-search-row:hover{background:var(--accent-soft);}
  .job-search-row-id{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);}
  .job-search-row-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .review-heading{font-size:20px;font-weight:700;margin-bottom:2px;}
  .review-subheading{font-family:var(--mono);color:var(--muted);font-size:12.5px;margin-bottom:22px;}
  .review-row{display:grid;grid-template-columns:260px 1fr;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);}
  .review-row:last-child{border-bottom:none;}
  .review-label{font-size:12px;font-weight:600;color:var(--muted);}
  .review-value{font-size:13px;color:var(--ink);white-space:pre-wrap;}

  .lookupbar{display:flex;gap:8px;margin-bottom:20px;}
  .lookupbar input{flex:1;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .btn:hover{background:#0c5652;}
  .btn:disabled{background:var(--muted);cursor:not-allowed;}
  .btn.secondary{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn.small{padding:5px 10px;font-size:11.5px;}
  .btn.danger{background:none;border:1px solid var(--warn);color:var(--warn);}
  .btn.danger:hover{background:var(--warn-soft);}

  .refbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:14px 16px;margin-bottom:20px;font-size:12.5px;}
  .refbox .reftitle{font-weight:700;color:var(--accent);margin-bottom:6px;}
  .refgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .refgrid div span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}

  .waterfallrow{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;margin-bottom:8px;}
  .waterfallrow .catname{font-size:13px;font-weight:600;}

  .msg{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .msg.error{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);}
  .msg.success{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);}
  .msg a{color:inherit;font-weight:700;}

  .audience{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;background:#FAFBFA;}
  .audience-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .audience-head .titlefield{flex:1;margin-right:12px;}
  .crit-table{margin-bottom:10px;}
  .crit-row{display:grid;grid-template-columns:1fr 130px 1fr 32px;gap:8px;margin-bottom:6px;align-items:center;}
  .crit-row input,.crit-row select{padding:6px 8px;font-size:12.5px;border:1px solid var(--line);border-radius:5px;font-family:var(--sans);}
  .crit-row .rm{background:none;border:none;color:var(--warn);cursor:pointer;font-size:15px;line-height:1;}
  .crit-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:6px;}
  .add-audience{width:100%;border:1px dashed var(--line);background:none;color:var(--accent);border-radius:8px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;}
  .add-audience:hover{background:var(--accent-soft);border-color:var(--accent);}
  .add-crit{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px 0;}
  .geo-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(28,37,48,.5);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:10px;padding:24px;width:420px;max-width:90vw;}
  .modal h3{margin:0 0 6px;font-size:15px;}
  .modal p{font-size:12.5px;color:var(--muted);margin:0 0 14px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

  .footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
  .required{color:var(--warn);}
</style>

<script>
(function(){
  var MIRROR_SOURCE_KEYS = ['digitalGoLiveDate','mailDate'];
  var JOB_ID_TRIGGER_KEYS = ['jobNumberRaw','date','customer'];

  function computeJobId(values){
    var raw = (values.jobNumberRaw || '').trim();
    var client = (values.customer || '').trim();
    if(!raw || !client) return '';
    var yearSource = values.date ? new Date(values.date + 'T00:00:00') : new Date();
    var yy = String(yearSource.getFullYear()).slice(-2);
    return yy + '-' + client + '-' + raw;
  }

  function syncJobIdPreview(values){
    values.jobNumber = computeJobId(values);
    var previewEl = document.getElementById('job-id-preview');
    if(previewEl){
      previewEl.textContent = values.jobNumber ? (values.jobNumber + ' DP Instructions') : 'Fill in Job Number and Client to generate';
    }
  }
  var OPERATORS = ['equals','not equals','greater than','less than','greater than or equal','less than or equal','contains','since (date)','before (date)','within (distance)'];

  var DATA_SOURCE_OPTIONS = [
    {key:'franchise', label:'Franchise data'},
    {key:'corporate', label:'Corporate data'},
    {key:'acxiomProspects', label:'Acxiom Prospects'},
    {key:'webScraper', label:'Web scraper'},
    {key:'customerFileProvided', label:'Customer file provided'},
  ];
  var EMPLOYEE_OPTIONS = [
    {value:'chad@reflexblu.com', label:'Chad Stubbs'},
    {value:'evie@reflexblu.com', label:'Evie Stubbs'},
    {value:'jackson@reflexblu.com', label:'Jackson McCrary'},
    {value:'sophie@reflexblu.com', label:'Sophie Dunn'},
    {value:'steve@reflexblu.com', label:'Steve Pollock'},
    {value:'taylor@reflexblu.com', label:'Taylor Harris'},
    {value:'tiffany@reflexblu.com', label:'Tiffany Young'},
  ];

  var HYGIENE_OPTIONS = [
    {key:'validAddress', label:'Valid, deliverable address required'},
    {key:'flagExclusions', label:'Flag & report exclusion counts'},
  ];
  var DIGITAL_PLATFORM_OPTIONS = [
    {key:'facebook', label:'Facebook'},
    {key:'linkedin', label:'LinkedIn'},
    {key:'twitter', label:'Twitter'},
    {key:'display', label:'Display'},
    {key:'spotify', label:'Spotify'},
  ];

  var DP_SCHEMA_TOP = [
    { section:'Initiative', fields:[
      {key:'campaignGoal', label:'Campaign Goal', type:'textarea', hint:'What is this campaign trying to accomplish?'},
    ]},
    { section:'Job Information', fields:[
      {key:'jobNumberRaw', label:'Job Number', type:'text', required:true, hint:'Short job number, e.g. 1234', row:'jobA'},
      {key:'date', label:'Date', type:'date', row:'jobA'},
      {key:'customer', label:'Client', type:'text', required:true, row:'jobB'},
      {key:'project', label:'Project', type:'text', row:'jobB'},
      {key:'__jobIdPreview', type:'jobIdPreview'},
      {key:'requestedBy', label:'Requested By', type:'select', options:EMPLOYEE_OPTIONS, required:true, hint:'Used to notify you when the Post-Processing Writeup is completed'},
    ]},
    { section:'Key Dates & Deliverables', fields:[
      {key:'waterfallDue', label:'Waterfall Report Due Date', type:'date', row:'datesA'},
      {key:'audiencesPostedDate', label:'Audiences Posted Date', type:'date', row:'datesA'},
      {key:'digitalGoLiveDate', label:'Digital Go Live Date', type:'date', hint:'Feeds Tracking below automatically', row:'datesB'},
      {key:'mailDate', label:'Mail Date', type:'date', hint:'Feeds Tracking below automatically', row:'datesB'},
      {key:'waterfallCounts', label:'Waterfall Report Counts Needed', type:'textarea', hint:'Comma-separated categories, e.g. Source file counts, Foreign counts, Hold counts, Address Errors, Seeds, State, Duplicate Suppressions'},
    ]},
    { section:'Channel Deployment', fields:[
      {key:'channel', label:'Channel(s)', type:'select', options:['Direct Mail','Digital','Both'], triggersRerender:true, row:'chanA', onChangeEffect:function(v){ if(v.channel==='Direct Mail'||v.channel==='Both'){ v.hygiene = v.hygiene || {}; v.hygiene.validAddress = true; } }},
      {key:'digitalPlatforms', label:'Digital Platform(s)', type:'text', hint:'e.g. Facebook, LinkedIn, Twitter, Display, Spotify', requiredIf:function(v){ return v.channel==='Digital' || v.channel==='Both'; }, row:'chanA'},
      {key:'variableImagery', label:'Direct Mail Variable Imagery Fields', type:'textarea', hint:'Free text — variable fields needed for creative/lettershop', requiredIf:function(v){ return v.channel==='Direct Mail' || v.channel==='Both'; }},
    ]},
    { section:'Volume & Budget', fields:[
      {key:'budget', label:'Investment', type:'money', row:'volA'},
      {key:'targetQuantity', label:'Target Quantity (final, post-netdown)', type:'quantity', row:'volA'},
      {key:'controlGroupNeeded', label:'Control Group Needed?', type:'yesno'},
      {key:'controlGroup', label:'Control Group Quantity/Logic', type:'textarea', showIf:function(v){ return v.controlGroupNeeded==='Yes'; }, requiredIf:function(v){ return v.controlGroupNeeded==='Yes'; }},
    ]},
  ];

  var DP_SCHEMA_BOTTOM = [
    { section:'Standard Data Cleansing', fields:[
      {key:'addressCleansingMethod', label:'Address Cleansing Method', type:'select', options:['NCOA','CASS','Both','None'], row:'cleanA'},
      {key:'caseChange', label:'Case Change', type:'select', options:['Mixed Case','Upper Case','No Change'], row:'cleanA'},
      {key:'retainOriginalAddress', label:'Retain Original Address', type:'checkboxgroup', options:[{key:'retain', label:'Retain original address'}]},
      {key:'moveHandling', label:'Move Handling (post-NCOA)', type:'select', options:['Keep if moved — still in state','Keep if moved — out of area','Keep regardless of move destination','Suppress if moved'], hint:'How to treat records NCOA flags as moved', row:'cleanB'},
      {key:'foreignRecords', label:'Foreign Records Handling', type:'select', options:['Retain in separate file','Suppress','Include in main file'], row:'cleanB'},
      {key:'householdNaming', label:'Household Naming/Addressing', type:'checkboxgroup', options:[{key:'needed', label:'Household naming/addressing required'}]},
      {key:'householdNamingConvention', label:'Naming Convention', type:'select', options:['Last Name + Residence','Full Name'], showIf:function(v){ return v.householdNaming && v.householdNaming.needed; }},
    ]},
    { section:'Data Hygiene', fields:[
      {key:'hygiene', label:'Requirements', type:'checkboxgroup', options:HYGIENE_OPTIONS},
      {key:'dedupLevel', label:'Dedupe Level', type:'select', options:['Household','Last Name + Address','Full Name + Address','Other'], triggersRerender:true},
      {key:'dedupLevelOther', label:'Specify Dedupe Level', type:'text', showIf:function(v){ return v.dedupLevel === 'Other'; }},
    ]},
    { section:'Seeds', fields:[
      {key:'seedLocation', label:'Seed List Location', type:'text', hint:'Enter "n/a - included in main mailing" if applicable', row:'seedA'},
      {key:'seedQuantity', label:'Seed Quantity', type:'quantity', row:'seedA'},
    ]},
    { section:'Additional Data Processing Instructions', fields:[
      {key:'additionalInstructions', label:'Additional Instructions', type:'textarea', hint:'Catch-all for anything not covered above'},
    ]},
    { section:'Tracking', fields:[
      {key:'__digitalMirror', type:'mirror', label:'Digital Go Live Date', sourceKey:'digitalGoLiveDate', row:'trkA'},
      {key:'__mailMirror', type:'mirror', label:'Mail Date', sourceKey:'mailDate', row:'trkA'},
      {key:'reportingCadence', label:'Reporting Cadence', type:'select', options:['One-time','Daily','Weekly','Monthly','Ongoing / Continuous','Other','N/A'], triggersRerender:true, row:'trkB'},
      {key:'trackingWindow', label:'Tracking Window', type:'text', hint:'How long tracking runs — distinct from how often it reports', row:'trkB'},
      {key:'reportingCadenceDays', label:'Cadence (Days)', type:'text', showIf:function(v){ return v.reportingCadence === 'Other'; }},
      {key:'newTableauUsers', label:'New Tableau Users', type:'textarea', hint:'Name, email'},
      {key:'responderDef', label:'Responder Definition', type:'textarea'},
      {key:'furtherTracking', label:'Further Tracking Instructions', type:'textarea'},
    ]},
  ];

  var WRITEUP_STATIC = [
    { section:'Waterfall File', fields:[
      {key:'waterfallFilePath', label:'Waterfall File Path', type:'text', hint:'Location of the completed waterfall report'},
    ]},
    { section:'Deviations', fields:[
      {key:'deviations', label:'Deviations from DP Instructions & Reason', type:'textarea'},
    ]},
    { section:'Data Quality', fields:[
      {key:'dataQuality', label:'Data Quality Issues Encountered', type:'textarea'},
    ]},
    { section:'Final File Confirmation', fields:[
      {key:'finalCount', label:'Final File Count', type:'text', row:'wfA'},
      {key:'deliveryTimestamp', label:'Delivery Timestamp', type:'text', row:'wfA'},
    ]},
    { section:'Sign-off', fields:[
      {key:'runBy', label:'Run By', type:'text', row:'wfB'},
      {key:'qaBy', label:"QA'd By", type:'text', row:'wfB'},
      {key:'dateCompleted', label:'Date Completed', type:'date', row:'wfB'},
    ]},
  ];

  var DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMv6JihaFS4Sp3JN8XCQn_PtGyDA55qp2LYWq6ywPAckM9o2cUdqjzmzqOzEpR7XsX/exec';

  var state = {
    view:'dp', appsScriptUrl: DEFAULT_APPS_SCRIPT_URL,
    dpValues:{ audiences:[] },
    writeupJobNumber:'', writeupJob:null, writeupWaterfall:[], writeupValues:{},
    allJobs:null, jobsLoading:false, jobSearchQuery:''
  };
  var audienceIdCounter = 1;

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function text(s){ return document.createTextNode(s); }

  function formatThousands(raw){
    if(!raw) return '';
    var parts = raw.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }

  function fieldInput(f, values, container){
    if(f.showIf && !f.showIf(values)) return;

    if(f.type === 'money' || f.type === 'quantity'){
      var mfwrap = el('div', {class:'field'});
      var mfRequired = f.required || (f.requiredIf && f.requiredIf(values));
      var mflbl = el('label', {}, [text(f.label + (mfRequired ? ' ' : ''))]);
      if(mfRequired) mflbl.appendChild(el('span',{class:'required'},[text('*')]));
      mfwrap.appendChild(mflbl);
      var moneyWrap = el('div', {class: f.type === 'money' ? 'money-wrap' : ''});
      if(f.type === 'money') moneyWrap.appendChild(el('span',{class:'money-prefix'},[text('$')]));
      var mfInput = el('input', {type:'text', inputmode:'decimal'});
      mfInput.value = values[f.key] || '';
      mfInput.addEventListener('input', function(){
        var raw = mfInput.value.replace(/[^0-9.]/g,'');
        var formatted = formatThousands(raw);
        values[f.key] = formatted;
        mfInput.value = formatted;
      });
      moneyWrap.appendChild(mfInput);
      mfwrap.appendChild(moneyWrap);
      if(f.hint) mfwrap.appendChild(el('span',{class:'hint'},[text(f.hint)]));
      container.appendChild(mfwrap);
      return;
    }

    if(f.type === 'yesno'){
      var ywrap = el('div', {class:'field'});
      ywrap.appendChild(el('label', {}, [text(f.label)]));
      var ygrp = el('div', {class:'yesno-group'});
      ['Yes','No'].forEach(function(opt){
        var b = el('button', {type:'button', class:'yesno-btn' + (values[f.key]===opt ? ' active' : '')}, [text(opt)]);
        b.addEventListener('click', function(){ values[f.key] = opt; render(); });
        ygrp.appendChild(b);
      });
      ywrap.appendChild(ygrp);
      container.appendChild(ywrap);
      return;
    }

    if(f.type === 'jobIdPreview'){
      var jwrap = el('div', {class:'field'});
      jwrap.appendChild(el('label', {}, [text('Job ID / Sheet Name')]));
      var previewBox = el('div', {class:'job-id-preview', id:'job-id-preview'});
      var current = values.jobNumber ? (values.jobNumber + ' DP Instructions') : 'Fill in Job Number and Client to generate';
      previewBox.textContent = current;
      jwrap.appendChild(previewBox);
      jwrap.appendChild(el('span',{class:'hint'},[text('Auto-generated as {Year}-{Client}-{Job Number} — used for the Sheet name and in emails')]));
      container.appendChild(jwrap);
      return;
    }

    if(f.type === 'mirror'){
      var mwrap = el('div', {class:'field'});
      mwrap.appendChild(el('label', {}, [text(f.label)]));
      var mInput = el('input', {type:'date', disabled:'disabled', id:'mirror-' + f.sourceKey});
      mInput.value = values[f.sourceKey] || '';
      mwrap.appendChild(mInput);
      if(f.hint) mwrap.appendChild(el('span',{class:'hint'},[text(f.hint)]));
      container.appendChild(mwrap);
      return;
    }

    var wrap = el('div', {class:'field'});
    var isRequired = f.required || (f.requiredIf && f.requiredIf(values));
    var lbl = el('label', {}, [text(f.label + (isRequired ? ' ' : ''))]);
    if(isRequired) lbl.appendChild(el('span',{class:'required'},[text('*')]));
    wrap.appendChild(lbl);

    if(f.type === 'checkboxgroup'){
      values[f.key] = values[f.key] || {};
      var grp = el('div', {class:'checkgroup'});
      f.options.forEach(function(o){
        var id = 'chk_' + f.key + '_' + o.key;
        var item = el('label', {class:'checkitem', for:id});
        var cb = el('input', {type:'checkbox', id:id});
        cb.checked = !!values[f.key][o.key];
        cb.addEventListener('change', function(){ values[f.key][o.key] = cb.checked; render(); });
        item.appendChild(cb); item.appendChild(text(o.label));
        grp.appendChild(item);
      });
      wrap.appendChild(grp);
      container.appendChild(wrap);
      return;
    }

    var input;
    if(f.type === 'textarea'){
      input = el('textarea', {});
      input.value = values[f.key] || '';
    } else if(f.type === 'select'){
      input = el('select', {});
      input.appendChild(el('option',{value:''},[text('Select...')]));
      f.options.forEach(function(o){
        var optValue = (typeof o === 'object') ? o.value : o;
        var optLabel = (typeof o === 'object') ? o.label : o;
        var opt = el('option', {value:optValue}, [text(optLabel)]);
        if(optValue === values[f.key]) opt.selected = true;
        input.appendChild(opt);
      });
    } else {
      input = el('input', {type: f.type === 'date' ? 'date' : (f.type === 'number' ? 'number' : 'text')});
      input.value = values[f.key] || '';
      if(f.type === 'date'){
        input.addEventListener('click', function(){ try{ input.showPicker(); }catch(e){} });
        input.addEventListener('focus', function(){ try{ input.showPicker(); }catch(e){} });
      }
    }
    input.addEventListener('input', function(){
      values[f.key] = input.value;
      if(MIRROR_SOURCE_KEYS.indexOf(f.key) !== -1){
        var mirrorEl = document.getElementById('mirror-' + f.key);
        if(mirrorEl) mirrorEl.value = input.value;
      }
      if(JOB_ID_TRIGGER_KEYS.indexOf(f.key) !== -1){
        syncJobIdPreview(values);
      }
    });
    if(f.type === 'select' && f.triggersRerender){
      input.addEventListener('change', function(){
        if(f.onChangeEffect) f.onChangeEffect(values);
        render();
      });
    }
    wrap.appendChild(input);
    if(f.hint) wrap.appendChild(el('span',{class:'hint'},[text(f.hint)]));
    container.appendChild(wrap);
  }

  function validateSchema(schema, values, missing){
    schema.forEach(function(sec){
      sec.fields.forEach(function(f){
        if(f.showIf && !f.showIf(values)) return;
        var isRequired = f.required || (f.requiredIf && f.requiredIf(values));
        if(!isRequired) return;
        var val = f.type === 'checkboxgroup' ? Object.keys(values[f.key]||{}).some(function(k){return values[f.key][k];}) : values[f.key];
        if(!val || (typeof val === 'string' && !val.trim())) missing.push(f.label);
      });
    });
  }

  function renderSchemaForm(container, schema, values){
    schema.forEach(function(sec){
      var s = el('div', {class:'section'});
      s.appendChild(el('h2', {}, [text(sec.section)]));
      var fields = sec.fields;
      var i = 0;
      while(i < fields.length){
        var f = fields[i];
        if(f.showIf && !f.showIf(values)){ i++; continue; }
        if(f.row){
          var group = [f];
          var j = i + 1;
          while(j < fields.length && fields[j].row === f.row){
            if(!(fields[j].showIf && !fields[j].showIf(values))) group.push(fields[j]);
            j++;
          }
          var rowDiv = el('div', {class: group.length >= 3 ? 'row3' : 'row2'});
          group.forEach(function(gf){ fieldInput(gf, values, rowDiv); });
          s.appendChild(rowDiv);
          i = j;
        } else {
          fieldInput(f, values, s);
          i++;
        }
      }
      container.appendChild(s);
    });
  }

  function buildSectionsPayload(schema, values){
    return schema.map(function(sec){
      var fields = [];
      sec.fields.forEach(function(f){
        if(f.showIf && !f.showIf(values)) return;
        if(f.type === 'mirror'){
          fields.push({label:f.label, value: values[f.sourceKey] || ''});
        } else if(f.type === 'checkboxgroup'){
          var checked = (f.options||[]).filter(function(o){ return values[f.key] && values[f.key][o.key]; }).map(function(o){ return o.label; });
          fields.push({label:f.label, value: checked.join(', ') || (f.options.length===1 ? 'No' : '')});
        } else {
          fields.push({label:f.label, value: values[f.key] || ''});
        }
      });
      return { section: sec.section, fields: fields };
    });
  }

  function newAudience(){
    return {
      id: audienceIdCounter++,
      collapsed: false,
      name:'', definition:'',
      inclusion:[{field:'',operator:'equals',value:''}],
      exclusion:[],
      priority:'', quantityTarget:'',
      geoScope:'', radiusType:'', radiusValue:'', clinicGridLocation:'',
      dataSources:{}, customerFilePath:'', customerFileQuantity:''
    };

  function audienceSummaryText(a){
    var critCount = a.inclusion.filter(function(r){ return r.field || r.value; }).length;
    var exclCount = a.exclusion.filter(function(r){ return r.field || r.value; }).length;
    var parts = [];
    if(a.definition) parts.push(a.definition);
    var ruleBits = critCount + ' inclusion rule' + (critCount !== 1 ? 's' : '');
    if(exclCount) ruleBits += ', ' + exclCount + ' exclusion rule' + (exclCount !== 1 ? 's' : '');
    parts.push(ruleBits);
    return parts.join(' — ');
  }

  function renderCriteriaTable(label, rows, addLabel){
    var wrap = el('div', {class:'crit-table'});

    rows.forEach(function(row, idx){
      var r = el('div', {class:'crit-row'});

      fieldInp.value = row.field;
      fieldInp.addEventListener('input', function(){ row.field = fieldInp.value; });

      var opSel = el('select', {});
      OPERATORS.forEach(function(o){
        var opt = el('option', {value:o}, [text(o)]);
        if(o === row.operator) opt.selected = true;
        opSel.appendChild(opt);
      });
      opSel.addEventListener('change', function(){ row.operator = opSel.value; });

      var valInp = el('input', {type:'text', placeholder:'Value (e.g. 700000+)'});
      valInp.value = row.value;
      valInp.addEventListener('input', function(){ row.value = valInp.value; });

      var rm = el('button', {class:'rm', type:'button'}, [text('×')]);
      rm.addEventListener('click', function(){ rows.splice(idx,1); render(); });

      r.appendChild(fieldInp); r.appendChild(opSel); r.appendChild(valInp); r.appendChild(rm);
      wrap.appendChild(r);
    });
    var addBtn = el('button', {class:'add-crit', type:'button'}, [text('+ ' + addLabel)]);

  function audiencesToSections(audiences){
    return audiences.map(function(a, i){
      var fields = [];
      fields.push({label:'Definition', value:a.definition || ''});
      fields.push({label:'Inclusion Criteria', value: a.inclusion.filter(function(r){return r.field||r.value;}).map(function(r){ return r.field + ' ' + r.operator + ' ' + r.value; }).join(' | ')});
      fields.push({label:'Exclusion Criteria', value: a.exclusion.filter(function(r){return r.field||r.value;}).map(function(r){ return r.field + ' ' + r.operator + ' ' + r.value; }).join(' | ')});
      fields.push({label:'Priority', value:a.priority || ''});
      fields.push({label:'Quantity Target/Cap', value:a.quantityTarget || ''});
      fields.push({label:'Area / Market', value:a.geoScope || ''});
      fields.push({label:'Radius', value: (a.radiusValue && a.radiusType) ? (a.radiusValue + ' ' + a.radiusType) : ''});
      fields.push({label:'Clinic Grid File Location', value:a.clinicGridLocation || ''});
      var ds = DATA_SOURCE_OPTIONS.filter(function(o){ return a.dataSources[o.key]; }).map(function(o){ return o.label; });
      fields.push({label:'Data Source(s)', value: ds.join(', ')});
      if(a.dataSources.customerFileProvided){
        fields.push({label:'Customer File Path', value:a.customerFilePath || ''});
        fields.push({label:'Customer File Quantity', value:a.customerFileQuantity || ''});
      }
      return { section: 'Audience ' + (i+1) + ': ' + (a.name || 'Untitled'), fields: fields };
    });
  }

  async function callBackend(action, payload){
    if(!state.appsScriptUrl) throw new Error('Apps Script Web App URL is not set. Click "Connect Sheet" to add it.');
    var res = await fetch(state.appsScriptUrl, { method: 'POST', body: JSON.stringify({ action: action, payload: payload }) });
    var data = await res.json();
    if(!data.success) throw new Error(data.error || 'Unknown error');
    return data;
  }

  function renderFlow(root){
    var flow = el('div', {class:'flow'});
    var n1 = el('div', {class:'flownode' + ((state.view==='dp'||state.view==='review') ? ' active' : '')}, [
      el('div',{class:'num'},[text('1')]),
      el('div', {}, [el('div',{class:'label'},[text('New DP Instructions')]), el('div',{class:'desc'},[text('Creates the job Sheet')])])
    ]);
    var n2 = el('div', {class:'flownode' + (state.view==='writeup' ? ' active' : '')}, [
      el('div',{class:'num'},[text('2')]),
      el('div', {}, [el('div',{class:'label'},[text('Post-Processing Writeup')]), el('div',{class:'desc'},[text('Updates it after the run')])])
    ]);
    n1.addEventListener('click', function(){ state.view='dp'; render(); });
    n2.addEventListener('click', function(){ state.view='writeup'; render(); });
    flow.appendChild(n1); flow.appendChild(el('div',{class:'flowline'})); flow.appendChild(n2);
    root.appendChild(flow);
  }

  function renderDpView(root){
    var panel = el('div', {class:'panel'});
    if(state.dpMsg) panel.appendChild(state.dpMsg);
    renderSchemaForm(panel, DP_SCHEMA_TOP, state.dpValues);
    renderAudienceBuilder(panel);
    renderSchemaForm(panel, DP_SCHEMA_BOTTOM, state.dpValues);

    var actions = el('div', {class:'footer-actions'});
    var btn = el('button', {class:'btn'}, [text('Review Selections')]);
    btn.addEventListener('click', function(){
      if(!state.dpValues.jobNumber || !state.dpValues.jobNumber.trim()){
        state.dpMsg = el('div', {class:'msg error'}, [text('Job Number and Client are both required to generate the Job ID.')]);
        render();
        return;
      }
      var missing = [];
      validateSchema(DP_SCHEMA_TOP, state.dpValues, missing);
      validateSchema(DP_SCHEMA_BOTTOM, state.dpValues, missing);
      if(missing.length){
        state.dpMsg = el('div', {class:'msg error'}, [text('Missing required field(s): ' + missing.join(', '))]);
        render();
        return;
      }
      state.dpMsg = null;
      state.view = 'review';
      render();
      window.scrollTo(0, 0);
    });
    actions.appendChild(btn);
    panel.appendChild(actions);
    root.appendChild(panel);
  }

  function summaryRow(label, value){
    var row = el('div', {class:'review-row'});
    row.appendChild(el('div', {class:'review-label'}, [text(label)]));
    row.appendChild(el('div', {class:'review-value'}, [text(value && String(value).trim() ? value : '—')]));
    return row;
  }

  function renderReviewSection(container, title, fields){
    var s = el('div', {class:'section'});
    s.appendChild(el('h2', {}, [text(title)]));
    fields.forEach(function(f){ s.appendChild(summaryRow(f.label, f.value)); });
    container.appendChild(s);
  }

  function renderReviewView(root){
    var panel = el('div', {class:'panel'});
    if(state.dpMsg) panel.appendChild(state.dpMsg);

    panel.appendChild(el('div', {class:'review-heading'}, [text('Review before sending')]));
    panel.appendChild(el('div', {class:'review-subheading'}, [text('Job # ' + state.dpValues.jobNumber)]));

    var sections = buildSectionsPayload(DP_SCHEMA_TOP, state.dpValues)
      .concat(audiencesToSections(state.dpValues.audiences))
      .concat(buildSectionsPayload(DP_SCHEMA_BOTTOM, state.dpValues));
    sections.forEach(function(sec){ renderReviewSection(panel, sec.section, sec.fields); });

    var actions = el('div', {class:'footer-actions'});
    var editBtn = el('button', {class:'btn secondary'}, [text('Edit')]);
    editBtn.addEventListener('click', function(){ state.view = 'dp'; state.dpMsg = null; render(); window.scrollTo(0,0); });
    var sendBtn = el('button', {class:'btn'}, [text('Send DP Instructions')]);
    sendBtn.addEventListener('click', async function(){
      sendBtn.disabled = true; sendBtn.textContent = 'Sending...';
      try{
        var payload = {
          jobNumber: state.dpValues.jobNumber.trim(),
          customer: state.dpValues.customer || '',
          project: state.dpValues.project || '',
          sections: sections
        };
        var res = await callBackend('createJob', payload);
        state.dpMsg = el('div', {class:'msg success'});
        state.dpMsg.appendChild(text('Job Sheet created. '));
        state.dpMsg.appendChild(el('a', {href: res.url, target:'_blank'}, [text('Open in Google Sheets →')]));
        if(res.emailWarning){
          state.dpMsg.appendChild(el('div', {style:'margin-top:8px;color:var(--warn);font-weight:600;'}, [text('Note: confirmation emails failed to send — ' + res.emailWarning)]));
        }
        state.view = 'dp';
      }catch(err){
        state.dpMsg = el('div', {class:'msg error'}, [text(err.message)]);
      }
      render();
    });
    actions.appendChild(editBtn); actions.appendChild(sendBtn);
    panel.appendChild(actions);
    root.appendChild(panel);
  }

  function parseWaterfallCategories(raw){
    if(!raw) return [];
    return raw.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  }

  function ensureJobsLoaded(){
    if(state.allJobs !== null || state.jobsLoading) return;
    state.jobsLoading = true;
    callBackend('listJobs', {}).then(function(res){
      state.allJobs = res.jobs || [];
      state.jobsLoading = false;
      render();
    }).catch(function(err){
      state.allJobs = [];
      state.jobsLoading = false;
      render();
    });
  }

  async function loadJobForWriteup(jn){
    try{
      var res = await callBackend('getJob', { jobNumber: jn });
      state.writeupJobNumber = jn;
      state.writeupJob = res.fields;
      state.writeupWaterfall = parseWaterfallCategories(res.fields['Waterfall Report Counts Needed']);
      state.writeupValues = {};
      state.writeupMsg = null;
    }catch(err){
      state.writeupMsg = el('div', {class:'msg error'}, [text(err.message)]);
      state.writeupJob = null;
    }
    render();
  }

  function renderJobSearchResults(resultsBox){
    resultsBox.innerHTML = '';
    if(state.jobsLoading){
      resultsBox.appendChild(el('div',{class:'job-search-empty'},[text('Loading jobs…')]));
      return;
    }
    var query = (state.jobSearchQuery || '').trim().toLowerCase();
    if(!query){
      resultsBox.appendChild(el('div',{class:'job-search-empty'},[text('Start typing to search — matches Job #, Client, or Project')]));
      return;
    }
    var matches = (state.allJobs || []).filter(function(j){
      return (j.jobNumber||'').toLowerCase().indexOf(query) !== -1
        || (j.jobNumberRaw||'').toLowerCase().indexOf(query) !== -1
        || (j.customer||'').toLowerCase().indexOf(query) !== -1
        || (j.project||'').toLowerCase().indexOf(query) !== -1;
    });
    if(!matches.length){
      resultsBox.appendChild(el('div',{class:'job-search-empty'},[text('No matching jobs found')]));
      return;
    }
    matches.slice(0,25).forEach(function(j){
      var row = el('div', {class:'job-search-row'});
      row.appendChild(el('div',{class:'job-search-row-id'},[text(j.jobNumber)]));
      row.appendChild(el('div',{class:'job-search-row-meta'},[text((j.customer||'—') + ' · ' + (j.project||'—'))]));
      row.addEventListener('click', function(){ loadJobForWriteup(j.jobNumber); });
      resultsBox.appendChild(row);
    });
  }

  function renderWriteupView(root){
    var panel = el('div', {class:'panel'});
    ensureJobsLoaded();

    if(!state.writeupJob){
      var searchWrap = el('div', {class:'field'});
      searchWrap.appendChild(el('label',{},[text('Search Jobs')]));
      var searchInput = el('input', {type:'text', placeholder:'Type a Job #, Client, or Project — e.g. "REG" or "7547"'});
      searchInput.value = state.jobSearchQuery || '';
      var resultsBox = el('div', {class:'job-search-results', id:'job-search-results'});
      searchInput.addEventListener('input', function(){
        state.jobSearchQuery = searchInput.value;
        renderJobSearchResults(resultsBox);
      });
      searchWrap.appendChild(searchInput);
      searchWrap.appendChild(resultsBox);
      panel.appendChild(searchWrap);
      renderJobSearchResults(resultsBox);
    } else {
      var backBtn = el('button', {class:'btn secondary small'}, [text('← Search a different job')]);
      backBtn.style.marginBottom = '16px';
      backBtn.addEventListener('click', function(){
        state.writeupJob = null;
        state.writeupJobNumber = '';
        state.jobSearchQuery = '';
        state.writeupMsg = null;
        render();
      });
      panel.appendChild(backBtn);
    }

    if(state.writeupMsg) panel.appendChild(state.writeupMsg);

    if(state.writeupJob){
      var ref = el('div', {class:'refbox'});
      ref.appendChild(el('div',{class:'reftitle'},[text('Referencing: ' + state.writeupJobNumber)]));
      var grid = el('div', {class:'refgrid'});
      ['Client','Project'].forEach(function(k){
        grid.appendChild(el('div', {}, [el('span',{},[text(k)]), text(state.writeupJob[k] || '—')]));
      });
      ref.appendChild(grid);
      panel.appendChild(ref);

      if(state.writeupWaterfall.length){
        var wsec = el('div', {class:'section'});
        wsec.appendChild(el('h2', {}, [text('Waterfall Actual Counts')]));
        state.writeupValues.waterfall = state.writeupValues.waterfall || {};
        state.writeupWaterfall.forEach(function(cat){
          var row = el('div', {class:'waterfallrow'});
          row.appendChild(el('div',{class:'catname'},[text(cat)]));
          var inp = el('input', {type:'text', placeholder:'Actual count'});
          inp.addEventListener('input', function(){ state.writeupValues.waterfall[cat] = inp.value; });
          row.appendChild(inp);
          wsec.appendChild(row);
        });
        panel.appendChild(wsec);
      }

      renderSchemaForm(panel, WRITEUP_STATIC, state.writeupValues);

      var actions = el('div', {class:'footer-actions'});
      var btn = el('button', {class:'btn'}, [text('Submit Writeup')]);
      btn.addEventListener('click', async function(){
        btn.disabled = true; btn.textContent = 'Saving...';
        try{
          var sections = buildSectionsPayload(WRITEUP_STATIC, state.writeupValues);
          if(state.writeupWaterfall.length){
            sections.unshift({
              section: 'Waterfall Actual Counts',
              fields: state.writeupWaterfall.map(function(cat){
                return { label: cat, value: (state.writeupValues.waterfall && state.writeupValues.waterfall[cat]) || '' };
              })
            });
          }
          var res = await callBackend('submitWriteup', { jobNumber: state.writeupJobNumber, sections: sections });
          state.writeupMsg = el('div', {class:'msg success'});
          state.writeupMsg.appendChild(text('Writeup saved. '));
          state.writeupMsg.appendChild(el('a', {href: res.url, target:'_blank'}, [text('Open in Google Sheets →')]));
          if(res.emailWarning){
            state.writeupMsg.appendChild(el('div', {style:'margin-top:8px;color:var(--warn);font-weight:600;'}, [text('Note: confirmation email failed to send — ' + res.emailWarning)]));
          }
        }catch(err){
          state.writeupMsg = el('div', {class:'msg error'}, [text(err.message)]);
        }
        render();
      });
      actions.appendChild(btn);
      panel.appendChild(actions);
    }
    root.appendChild(panel);
  }

  function render(){
    var root = document.getElementById('app');
    root.innerHTML = '';
    renderTopbar(root);
    renderFlow(root);
    if(!state.appsScriptUrl){
      var warn = el('div', {class:'msg error'}, [text('No Sheet backend connected yet — click "Connect Sheet" above to paste your Apps Script Web App URL.')]);
      warn.style.margin = '0 4px 16px';
      root.appendChild(warn);
    }
    if(state.view === 'dp') renderDpView(root);
    else if(state.view === 'review') renderReviewView(root);
    else renderWriteupView(root);
  }

  if(state.dpValues.audiences.length === 0) state.dpValues.audiences.push(newAudience());
  loadStoredUrl().then(render);
})();
</script>
