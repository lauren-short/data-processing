  .flownode{flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;transition:all .15s;}

  function el(tag, attrs, children){
    var e = document.createElement(tag);

    Object.keys(attrs).forEach(function(k){

      else if(k==='html') e.innerHTML = attrs[k];

  function formatThousands(raw){
    if(!raw) return '';

  function getSegmentData(a){

  function getDistinctCharValues(data, charKey){
    var seen = {};
    data.segs.forEach(function(s){
      if(s[charKey] !== undefined && s[charKey] !== null && s[charKey] !== '') seen[s[charKey]] = true;
    });
    return Object.keys(seen).sort();
  }

  function computeMatchingSegments(a){
    var data = getSegmentData(a);
    if(!data) return [];
    return data.segs.filter(function(seg){
      if(a.indexOperator && a.indexValue !== ''){
        var v = parseFloat(a.indexValue);
        if(isNaN(v)) { /* skip index filter if unparsable */ }
        else if(a.indexOperator === '>' && !(seg.index > v)) return false;
        else if(a.indexOperator === '<' && !(seg.index < v)) return false;
        else if(a.indexOperator === '>=' && !(seg.index >= v)) return false;
        else if(a.indexOperator === '<=' && !(seg.index <= v)) return false;
        else if(a.indexOperator === 'between'){
          var v2 = parseFloat(a.indexValueMax);
          if(!isNaN(v2) && !(seg.index >= v && seg.index <= v2)) return false;
        }
      }
      if(a.includeOtherDemographics){
        for(var charKey in (a.characteristicFilters || {})){
          var selected = a.characteristicFilters[charKey];
          if(selected && selected.length && selected.indexOf(seg[charKey]) === -1) return false;
        }
      }
      return true;
    });
  }

  function fillSegmentMatches(container, a){
    container.innerHTML = '';
    var matches = computeMatchingSegments(a);
    if(a.matchSortKey){
      matches = matches.slice().sort(function(x, y){
        var av = a.matchSortKey === 'num' ? parseInt(x.num, 10) : x.index;
        var bv = a.matchSortKey === 'num' ? parseInt(y.num, 10) : y.index;
        return a.matchSortDir === 'asc' ? (av - bv) : (bv - av);
      });
    }
    container.appendChild(el('div', {class:'segment-matches-title'}, [text(matches.length + ' matching segment' + (matches.length!==1?'s':''))]));
    if(matches.length){
      var table = el('table', {class:'segment-table'});
      function sortArrow(key){
        if(a.matchSortKey !== key) return '';
        return a.matchSortDir === 'asc' ? ' ▲' : ' ▼';
      }
      function makeSortableTh(label, key){
        var th = el('th', {class:'sortable-th'}, [text(label + sortArrow(key))]);
        th.addEventListener('click', function(){
          if(a.matchSortKey === key) a.matchSortDir = (a.matchSortDir === 'asc') ? 'desc' : 'asc';
          else { a.matchSortKey = key; a.matchSortDir = 'asc'; }
          fillSegmentMatches(container, a);
        });
        return th;
      }
      var thead = el('thead', {}, [el('tr', {}, [
        makeSortableTh('Segment Number', 'num'),
        el('th', {}, [text('Segment Name')]),
        makeSortableTh('Index', 'index')
      ])]);
      table.appendChild(thead);
      var tbody = el('tbody', {});
      matches.forEach(function(seg){
        tbody.appendChild(el('tr', {}, [
          el('td', {}, [text(seg.num)]),
          el('td', {}, [text(seg.name)]),
          el('td', {}, [text(String(Math.round(seg.index)))])
        ]));
      });
      table.appendChild(tbody);
      container.appendChild(table);
    }
  }

  function validateSchema(schema, values, missing){
    schema.forEach(function(sec){
      sec.fields.forEach(function(f){
        if(f.showIf && !f.showIf(values)) return;
        var isRequired = f.required || (f.requiredIf && f.requiredIf(values));
        if(!isRequired) return;
        var val = f.type === 'checkboxgroup' ? Object.keys(values[f.key]||{}).some(function(k){return values[f.key][k];}) : values[f.key];
        if(!val || (typeof val === 'string' && !val.trim())) missing.push(f.label);
      });
    });
  }

  function renderSchemaForm(container, schema, values){
    schema.forEach(function(sec){
      var s = el('div', {class:'section'});
      s.appendChild(el('h2', {}, [text(sec.section)]));
      var fields = sec.fields;
      var i = 0;
      while(i < fields.length){
        var f = fields[i];
        if(f.showIf && !f.showIf(values)){ i++; continue; }
        if(f.row){
          var group = [f];
          var j = i + 1;
          while(j < fields.length && fields[j].row === f.row){
            if(!(fields[j].showIf && !fields[j].showIf(values))) group.push(fields[j]);
            j++;
          }
          var rowDiv = el('div', {class: group.length >= 3 ? 'row3' : 'row2'});
          group.forEach(function(gf){ fieldInput(gf, values, rowDiv); });
          s.appendChild(rowDiv);
          i = j;
        } else {
          fieldInput(f, values, s);
          i++;
        }
      }
      container.appendChild(s);
    });
  }

  function buildSectionsPayload(schema, values){
    return schema.map(function(sec){
      var fields = [];
      sec.fields.forEach(function(f){
        if(f.showIf && !f.showIf(values)) return;
        if(f.key === 'customer'){
          fields.push({label:f.label, value: getEffectiveClientName(values)});
        } else if(f.type === 'mirror'){
          fields.push({label:f.label, value: values[f.sourceKey] || ''});
        } else if(f.type === 'checkboxgroup'){
          var checked = (f.options||[]).filter(function(o){ return values[f.key] && values[f.key][o.key]; }).map(function(o){ return o.label; });
          fields.push({label:f.label, value: checked.join(', ') || (f.options.length===1 ? 'No' : '')});
        } else {
          fields.push({label:f.label, value: values[f.key] || ''});
        }
      });
      return { section: sec.section, fields: fields };
    });
  }

  function buildGeneratedDefinition(a){
    if(!a.audienceType) return 'Select an Audience Type below to auto-generate a definition.';

    var isTWNewSite = (state.dpValues.customer === 'TW' && a.audienceType === 'Prospect' && a.twInitiative === 'Monthly New Site Opening');
    if(isTWNewSite){
      var siteCount = a.twSites.filter(function(s){ return s.store || s.address || s.city || s.state || s.zip; }).length;
      var subTypeLabel = a.twSubmissionType || 'Submission type not set';
      var monthLabel = a.twMonth ? (' — ' + a.twMonth) : '';
      return siteCount + ' new site opening' + (siteCount !== 1 ? 's' : '') + ' — Tidal Wave prospects — ' + subTypeLabel + monthLabel;
    }

    var parts = [a.audienceType];

    var dsOptions = a.audienceType === 'Customer' ? DATA_SOURCE_OPTIONS_CUSTOMER : DATA_SOURCE_OPTIONS_PROSPECT;
    var dsLabels = dsOptions.filter(function(o){ return a.dataSources[o.key]; }).map(function(o){ return o.label; });
    if(dsLabels.length) parts.push('via ' + dsLabels.join(', '));

    if(a.dataSources.acxiomProspects){
      var segData = getSegmentData(a);
      if(segData){
        var idxDesc = '';
        if(a.indexOperator === 'between' && a.indexValue !== '' && a.indexValueMax !== '') idxDesc = 'Index ' + a.indexValue + '–' + a.indexValueMax;
        else if(a.indexOperator && a.indexValue !== '') idxDesc = 'Index ' + a.indexOperator + ' ' + a.indexValue;
        if(idxDesc) parts.push(idxDesc);
        if(a.includeOtherDemographics){
          var charBits = [];
          for(var ck in a.characteristicFilters){
            if(a.characteristicFilters[ck] && a.characteristicFilters[ck].length) charBits.push(a.characteristicFilters[ck].join('/'));
          }
          if(charBits.length) parts.push(charBits.join(', '));
        }
        var segMatches = computeMatchingSegments(a);
        parts.push(segMatches.length + ' matching ' + segData.model + ' segment' + (segMatches.length !== 1 ? 's' : ''));
      }
    }

    var inclBits = a.inclusion.filter(function(r){ return r.field || r.value; }).map(function(r){ return r.field + ' ' + r.operator + ' ' + r.value; });
    if(inclBits.length) parts.push(inclBits.join('; '));
    var exclBits = a.exclusion.filter(function(r){ return r.field || r.value; }).map(function(r){ return 'excl. ' + r.field + ' ' + r.operator + ' ' + r.value; });
    if(exclBits.length) parts.push(exclBits.join('; '));

    if(a.geoScope) parts.push('in ' + a.geoScope + ((a.radiusValue && a.radiusType) ? ' (' + a.radiusValue + ' ' + a.radiusType + ')' : ''));

    if(parts.length === 1) return a.audienceType + ' — add criteria below to build out this definition';
    return parts.join(' — ');
  }

  function audienceSummaryText(a){
    var isTWNewSite = (state.dpValues.customer === 'TW' && a.audienceType === 'Prospect' && a.twInitiative === 'Monthly New Site Opening');
    var critCount = a.inclusion.filter(function(r){ return r.field || r.value; }).length;
    var exclCount = a.exclusion.filter(function(r){ return r.field || r.value; }).length;
    var parts = [];
    if(a.audienceType) parts.push(a.audienceType);
    if(a.definition) parts.push(a.definition);
    if(isTWNewSite){
      var siteCount = a.twSites.filter(function(s){ return s.store || s.address || s.city || s.state || s.zip; }).length;
      parts.push(siteCount + ' new site' + (siteCount !== 1 ? 's' : ''));
    } else {
      var ruleBits = critCount + ' inclusion rule' + (critCount !== 1 ? 's' : '');
      if(exclCount) ruleBits += ', ' + exclCount + ' exclusion rule' + (exclCount !== 1 ? 's' : '');
      parts.push(ruleBits);
    }
    if(a.dataSources && a.dataSources.acxiomProspects){
      var segData = getSegmentData(a);
      if(segData){
        var matches = computeMatchingSegments(a);
        parts.push(matches.length + ' matching segment' + (matches.length !== 1 ? 's' : ''));
      }
    }
    return parts.join(' — ');
  }

  function renderCriteriaTable(label, rows, addLabel){
    var wrap = el('div', {class:'crit-table'});

      var r = el('div', {class:'crit-row'});
      var fieldInp = el('input', {type:'text', placeholder:'Field (e.g. Home Value, Last Visit Date)'});
      fieldInp.value = row.field;
      fieldInp.addEventListener('input', function(){ row.field = fieldInp.value; });

      var opSel = el('select', {});
      OPERATORS.forEach(function(o){
        var opt = el('option', {value:o}, [text(o)]);
        if(o === row.operator) opt.selected = true;
        opSel.appendChild(opt);
      });
      opSel.addEventListener('change', function(){ row.operator = opSel.value; render(); });

      var valCell;
      if(row.operator === 'within last (time)'){
        var parts = (row.value || '').trim().split(/\s+/);
        var numPart = parts[0] || '';
        var unitPart = parts[1] || 'months';
        valCell = el('div', {class:'value-unit-row'});
        var numInp = el('input', {type:'text', inputmode:'numeric', placeholder:'e.g. 12'});
        numInp.value = numPart;

        ['days','months','years'].forEach(function(u){
          var opt = el('option', {value:u}, [text(u)]);
          if(u === unitPart) opt.selected = true;
          unitSel.appendChild(opt);
        });
        function syncValue(){ row.value = (numInp.value || '').trim() + ' ' + unitSel.value; }
        numInp.addEventListener('input', syncValue);
        unitSel.addEventListener('change', syncValue);
        if(!row.value) syncValue();
        valCell.appendChild(numInp); valCell.appendChild(unitSel);
      } else {
        var valInp = el('input', {type:'text', placeholder:'Value (e.g. 700000+)'});
        valInp.value = row.value;
        valInp.addEventListener('input', function(){ row.value = valInp.value; });
        valCell = valInp;
      }

      var rm = el('button', {class:'rm', type:'button'}, [text('×')]);
      rm.addEventListener('click', function(){ rows.splice(idx,1); render(); });

      r.appendChild(fieldInp); r.appendChild(opSel); r.appendChild(valCell); r.appendChild(rm);
      wrap.appendChild(r);
    });
    var addBtn = el('button', {class:'add-crit', type:'button'}, [text('+ ' + addLabel)]);

    wrap.appendChild(addBtn);

  }

  function renderAudienceBuilder(container){
    var s = el('div', {class:'section'});
    s.appendChild(el('h2', {}, [text('Audience Builder')]));
    state.dpValues.audiences.forEach(function(a){
      s.appendChild(a.collapsed ? renderAudienceSummary(a) : renderAudienceBlock(a));
    });
    var addBtn = el('button', {class:'add-audience', type:'button'}, [text('+ Add Audience')]);
    addBtn.addEventListener('click', function(){
      state.dpValues.audiences.forEach(function(a){ a.collapsed = true; });
      state.dpValues.audiences.push(newAudience());
      render();

    s.appendChild(addBtn);
    container.appendChild(s);

  function audiencesToSections(audiences){
    return audiences.map(function(a, i){
      var fields = [];
      fields.push({label:'Definition', value:a.definition || ''});
      fields.push({label:'Audience Type', value:a.audienceType || ''});
      var isTWNewSiteOut = (state.dpValues.customer === 'TW' && a.audienceType === 'Prospect' && a.twInitiative === 'Monthly New Site Opening');
      if(state.dpValues.customer === 'TW' && a.audienceType === 'Prospect'){
        fields.push({label:'Initiative', value: a.twInitiative || ''});
      }
      if(isTWNewSiteOut){
        fields.push({label:'Month', value: a.twMonth || ''});
        fields.push({label:'Submission Type', value: a.twSubmissionType || ''});
        var isDpSubmissionOut = (a.twSubmissionType === 'DP Instructions');
        var siteColsOut = ['Store','Address','City','State','Zip','Segment'];
        if(isDpSubmissionOut) siteColsOut = siteColsOut.concat(['Max Drive Time','Quantity']);
        fields.push({label:'New Sites', value: siteColsOut.join(' | ') + '\n' + a.twSites.filter(function(s){
          return s.store || s.address || s.city || s.state || s.zip || s.segment;
        }).map(function(s){
          var row = [s.store, s.address, s.city, s.state, s.zip, s.segment];
          if(isDpSubmissionOut) row = row.concat([s.maxDriveTime ? (s.maxDriveTime + ' min') : '', s.quantity || '']);
          return row.join(' | ');
        }).join('\n')});
      } else {
        fields.push({label:'Inclusion Criteria', value: a.inclusion.filter(function(r){return r.field||r.value;}).map(function(r){ return r.field + ' ' + r.operator + ' ' + r.value; }).join(' | ')});
        fields.push({label:'Exclusion Criteria', value: a.exclusion.filter(function(r){return r.field||r.value;}).map(function(r){ return r.field + ' ' + r.operator + ' ' + r.value; }).join(' | ')});
      }
      fields.push({label:'Priority', value:a.priority || ''});
      fields.push({label:'Quantity Target/Cap', value:a.quantityTarget || ''});
      if(!isTWNewSiteOut){
        fields.push({label:'Area / Market', value:a.geoScope || ''});
        fields.push({label:'Radius', value: (a.radiusValue && a.radiusType) ? (a.radiusValue + ' ' + a.radiusType) : ''});
        fields.push({label:'Clinic Grid File Location', value:a.clinicGridLocation || ''});
      }
      var dsOptions = a.audienceType === 'Customer' ? DATA_SOURCE_OPTIONS_CUSTOMER : DATA_SOURCE_OPTIONS_PROSPECT;
      var ds = dsOptions.filter(function(o){ return a.dataSources[o.key]; }).map(function(o){ return o.label; });
      fields.push({label:'Data Source(s)', value: ds.join(', ')});
      if(a.dataSources.customerFileProvided){
        fields.push({label:'Customer File Path', value:a.customerFilePath || ''});
        fields.push({label:'Customer File Quantity', value:a.customerFileQuantity || ''});
      }
      if(a.dataSources.acxiomProspects){
        var clientLabel = state.dpValues.customer === 'RTJ' ? ('RTJ - ' + (a.rtjProgram||''))
          : state.dpValues.customer === 'TW' ? ('TW - ' + (a.twRegion||''))
          : getEffectiveClientName(state.dpValues);
        fields.push({label:'Segmentation Client', value: clientLabel || ''});
        var segData = getSegmentData(a);
        if(segData){
          var indexDesc = '';
          if(a.indexOperator === 'between') indexDesc = 'Between ' + a.indexValue + ' and ' + a.indexValueMax;
          else if(a.indexOperator && a.indexValue !== '') indexDesc = a.indexOperator + ' ' + a.indexValue;
          fields.push({label:'Index Filter', value: indexDesc});
          var charDesc = [];
          if(a.includeOtherDemographics){
            for(var ck in a.characteristicFilters){
              if(a.characteristicFilters[ck] && a.characteristicFilters[ck].length) charDesc.push(ck + ': ' + a.characteristicFilters[ck].join('/'));
            }
          }
          fields.push({label:'Characteristic Filters', value: charDesc.join(' | ')});
          var matches = computeMatchingSegments(a);
          fields.push({label:'Matching Segments (' + segData.model + ')', value: 'Segment Number | Segment Name | Index\n' + matches.map(function(seg){
            return seg.num + ' | ' + seg.name + ' | ' + Math.round(seg.index);
          }).join('\n')});
        }
      }
      return { section: 'Audience ' + (i+1) + ': ' + (a.name || 'Untitled'), fields: fields };
    });
  }

  /* ---------------- backend + storage ---------------- */
  async function callBackend(action, payload){
    if(!state.appsScriptUrl) throw new Error('Apps Script Web App URL is not set. Click "Connect Sheet" to add it.');
    var res = await fetch(state.appsScriptUrl, { method: 'POST', body: JSON.stringify({ action: action, payload: payload }) });
    var data = await res.json();
    if(!data.success) throw new Error(data.error || 'Unknown error');
    return data;
  }
  async function loadStoredUrl(){
    try{ var r = await window.storage.get('appsScriptUrl'); if(r && r.value) state.appsScriptUrl = r.value; }catch(e){}
  }
  async function saveStoredUrl(url){
    state.appsScriptUrl = url;
    try{ await window.storage.set('appsScriptUrl', url); }catch(e){}
  }

  function showModal(){
    var overlay = el('div', {class:'modal-overlay'});
    var modal = el('div', {class:'modal'});
    modal.appendChild(el('h3', {}, [text('Connect your Sheet backend')]));
    modal.appendChild(el('p', {}, [text('Paste the Apps Script Web App URL (from Deploy > New deployment > Web app).')]));
    var input = el('input', {type:'text', placeholder:'https://script.google.com/macros/s/.../exec'});
    input.style.cssText = 'width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:12px;';
    input.value = state.appsScriptUrl;
    modal.appendChild(input);
    var actions = el('div', {class:'modal-actions'});
    var cancel = el('button', {class:'btn secondary'}, [text('Cancel')]);
    var save = el('button', {class:'btn'}, [text('Save')]);
    cancel.addEventListener('click', function(){ document.body.removeChild(overlay); });
    save.addEventListener('click', async function(){ await saveStoredUrl(input.value.trim()); document.body.removeChild(overlay); render(); });
    actions.appendChild(cancel); actions.appendChild(save);
    modal.appendChild(actions);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  function renderFlow(root){
    var flow = el('div', {class:'flow'});
    var n1 = el('div', {class:'flownode' + ((state.view==='dp'||state.view==='review') ? ' active' : '')}, [
      el('div',{class:'num'},[text('1')]),
      el('div', {}, [el('div',{class:'label'},[text('New DP Instructions')]), el('div',{class:'desc'},[text('Creates the job Sheet')])])
    ]);
    var n2 = el('div', {class:'flownode' + (state.view==='writeup' ? ' active' : '')}, [
      el('div',{class:'num'},[text('2')]),
      el('div', {}, [el('div',{class:'label'},[text('Post-Processing Writeup')]), el('div',{class:'desc'},[text('Updates it after the run')])])
    ]);
    n1.addEventListener('click', function(){ state.view='dp'; render(); });
    n2.addEventListener('click', function(){ state.view='writeup'; render(); });
    flow.appendChild(n1); flow.appendChild(el('div',{class:'flowline'})); flow.appendChild(n2);
    root.appendChild(flow);
  }

  function renderDpView(root){
    var panel = el('div', {class:'panel'});
    if(state.dpMsg) panel.appendChild(state.dpMsg);

    if(state.editingJobNumber){
      var editBanner = el('div', {class:'msg success', style:'display:flex;justify-content:space-between;align-items:center;'});
      editBanner.appendChild(el('div', {}, [text('Editing existing job: ' + state.editingJobNumber)]));
      var cancelEditBtn = el('button', {class:'btn secondary small'}, [text('Start New Job Instead')]);
      cancelEditBtn.addEventListener('click', function(){
        state.editingJobNumber = null;
        state.dpValues = { audiences:[newAudience()] };
        state.dpMsg = null;
        render();
        window.scrollTo(0,0);
      });
      editBanner.appendChild(cancelEditBtn);
      panel.appendChild(editBanner);
    } else {
      ensureJobsLoaded();
      if(!state.dpSearchMode){
        var openSearchWrap = el('div', {style:'display:flex;justify-content:flex-end;margin-bottom:16px;'});
        var openSearchBtn = el('button', {class:'btn secondary small'}, [text('Load an existing job to edit')]);
        openSearchBtn.addEventListener('click', function(){ state.dpSearchMode = true; render(); });
        openSearchWrap.appendChild(openSearchBtn);
        panel.appendChild(openSearchWrap);
      } else {
        var dpSearchWrap = el('div', {class:'field'});
        dpSearchWrap.appendChild(el('label',{},[text('Search Jobs to Edit')]));
        var dpSearchInput = el('input', {type:'text', placeholder:'Type a Job #, Client, or Project'});
        dpSearchInput.value = state.dpSearchQuery || '';
        var dpResultsBox = el('div', {class:'job-search-results'});
        dpSearchInput.addEventListener('input', function(){
          state.dpSearchQuery = dpSearchInput.value;
          renderJobSearchResults(dpResultsBox, state.dpSearchQuery, loadJobForEdit);
        });
        dpSearchWrap.appendChild(dpSearchInput);
        dpSearchWrap.appendChild(dpResultsBox);
        var closeSearchBtn = el('button', {class:'btn secondary small'}, [text('Cancel')]);
        closeSearchBtn.style.marginTop = '8px';
        closeSearchBtn.addEventListener('click', function(){ state.dpSearchMode = false; render(); });
        dpSearchWrap.appendChild(closeSearchBtn);
        panel.appendChild(dpSearchWrap);
        renderJobSearchResults(dpResultsBox, state.dpSearchQuery, loadJobForEdit);
      }
    }

    renderSchemaForm(panel, DP_SCHEMA_TOP, state.dpValues);
    renderAudienceBuilder(panel);
    renderSchemaForm(panel, DP_SCHEMA_BOTTOM, state.dpValues);

    var actions = el('div', {class:'footer-actions'});
    var btn = el('button', {class:'btn'}, [text('Review Selections')]);
    btn.addEventListener('click', function(){
      if(!state.dpValues.jobNumber || !state.dpValues.jobNumber.trim()){
        state.dpMsg = el('div', {class:'msg error'}, [text('Job Number and Client are both required to generate the Job ID.')]);
        render();
        return;
      }
      var missing = [];
      validateSchema(DP_SCHEMA_TOP, state.dpValues, missing);
      validateSchema(DP_SCHEMA_BOTTOM, state.dpValues, missing);
      if(missing.length){
        state.dpMsg = el('div', {class:'msg error'}, [text('Missing required field(s): ' + missing.join(', '))]);
        render();
        return;
      }
      state.dpMsg = null;
      state.view = 'review';
      render();
      window.scrollTo(0, 0);
    });
    actions.appendChild(btn);
    panel.appendChild(actions);
    root.appendChild(panel);
  }

  function summaryRow(label, value){
    var row = el('div', {class:'review-row'});
    row.appendChild(el('div', {class:'review-label'}, [text(label)]));
    row.appendChild(el('div', {class:'review-value'}, [text(value && String(value).trim() ? value : '—')]));
    return row;
  }

  function renderReviewSection(container, title, fields){
    var s = el('div', {class:'section'});
    s.appendChild(el('h2', {}, [text(title)]));
    fields.forEach(function(f){ s.appendChild(summaryRow(f.label, f.value)); });
    container.appendChild(s);
  }

  function renderReviewView(root){
    var panel = el('div', {class:'panel'});
    if(state.dpMsg) panel.appendChild(state.dpMsg);

    panel.appendChild(el('div', {class:'review-heading'}, [text(state.editingJobNumber ? 'Review before updating' : 'Review before sending')]));
    panel.appendChild(el('div', {class:'review-subheading'}, [text('Job # ' + state.dpValues.jobNumber)]));

    var sections = buildSectionsPayload(DP_SCHEMA_TOP, state.dpValues)
      .concat(audiencesToSections(state.dpValues.audiences))
      .concat(buildSectionsPayload(DP_SCHEMA_BOTTOM, state.dpValues));
    sections.forEach(function(sec){ renderReviewSection(panel, sec.section, sec.fields); });

    var actions = el('div', {class:'footer-actions'});
    var editBtn = el('button', {class:'btn secondary'}, [text('Edit')]);
    editBtn.addEventListener('click', function(){ state.view = 'dp'; state.dpMsg = null; render(); window.scrollTo(0,0); });
    var currentJobId = state.dpValues.jobNumber.trim();
    var isEditing = !!(state.editingJobNumber && state.editingJobNumber === currentJobId);
    var isNewMonthWhileEditing = !!(state.editingJobNumber && state.editingJobNumber !== currentJobId);
    var sendBtn = el('button', {class:'btn'}, [text(isEditing ? 'Update DP Instructions' : 'Send DP Instructions')]);
    if(isNewMonthWhileEditing){
      panel.appendChild(el('div', {class:'msg', style:'background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);'}, [
        text('This Month change creates a new Sheet (' + currentJobId + ' DP Instructions) rather than updating ' + state.editingJobNumber + ' DP Instructions.')
      ]));
    }
    sendBtn.addEventListener('click', async function(){
      sendBtn.disabled = true; sendBtn.textContent = isEditing ? 'Updating...' : 'Sending...';
      try{
        var payload = {
          jobNumber: currentJobId,
          customer: getEffectiveClientName(state.dpValues) || '',
          project: state.dpValues.project || '',
          sections: sections,
          rawState: JSON.stringify(state.dpValues)
        };
        var res = isEditing
          ? await callBackend('updateJob', payload)
          : await callBackend('createJob', payload);
        state.dpMsg = el('div', {class:'msg success'});
        state.dpMsg.appendChild(text(isEditing ? 'Job Sheet updated. ' : 'Job Sheet created. '));
        state.dpMsg.appendChild(el('a', {href: res.url, target:'_blank'}, [text('Open in Google Sheets →')]));
        if(res.emailWarning){
          state.dpMsg.appendChild(el('div', {style:'margin-top:8px;color:var(--warn);font-weight:600;'}, [text('Note: confirmation emails failed to send — ' + res.emailWarning)]));
        }
        if(isNewMonthWhileEditing) state.editingJobNumber = currentJobId;
        state.view = 'dp';
      }catch(err){
        state.dpMsg = el('div', {class:'msg error'}, [text(err.message)]);
      }
      render();
    });
    actions.appendChild(editBtn); actions.appendChild(sendBtn);
    panel.appendChild(actions);
    root.appendChild(panel);
  }

  function parseWaterfallCategories(raw){
    if(!raw) return [];
    return raw.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  }

  function ensureJobsLoaded(){
    if(state.allJobs !== null || state.jobsLoading) return;
    state.jobsLoading = true;
    callBackend('listJobs', {}).then(function(res){
      state.allJobs = res.jobs || [];
      state.jobsLoading = false;
      render();
    }).catch(function(err){
      state.allJobs = [];
      state.jobsLoading = false;
      render();
    });
  }

  async function loadJobForWriteup(jn){
    try{
      var res = await callBackend('getJob', { jobNumber: jn });
      state.writeupJobNumber = jn;
      state.writeupJob = res.fields;
      state.writeupWaterfall = parseWaterfallCategories(res.fields['Waterfall Report Counts Needed']);
      state.writeupValues = {};
      state.writeupMsg = null;
    }catch(err){
      state.writeupMsg = el('div', {class:'msg error'}, [text(err.message)]);
      state.writeupJob = null;
    }
    render();
  }

  async function loadJobForEdit(jn){
    try{
      var res = await callBackend('getJobRawState', { jobNumber: jn });
      if(!res.rawState){
        state.dpMsg = el('div', {class:'msg error'}, [text('This job was created before edit support was added and can\'t be loaded for editing. You can still open it directly in Google Sheets.')]);
        render();
        return;
      }
      var loaded = res.rawState;
      loaded.audiences = (loaded.audiences || []).map(function(saved){
        var fresh = newAudience();
        var freshId = fresh.id;
        for(var k in saved){ fresh[k] = saved[k]; }
        fresh.id = freshId;
        return fresh;
      });
      state.dpValues = loaded;
      state.editingJobNumber = jn;
      state.dpSearchMode = false;
      state.dpMsg = el('div', {class:'msg success'}, [text('Loaded ' + jn + ' for editing. Job Number and Client are locked while editing this job.')]);
    }catch(err){
      state.dpMsg = el('div', {class:'msg error'}, [text(err.message)]);
    }
    render();
    window.scrollTo(0, 0);
  }

  function renderJobSearchResults(resultsBox, queryValue, onSelect){
    resultsBox.innerHTML = '';
    if(state.jobsLoading){
      resultsBox.appendChild(el('div',{class:'job-search-empty'},[text('Loading jobs…')]));
      return;
    }
    var query = (queryValue || '').trim().toLowerCase();
    if(!query){
      resultsBox.appendChild(el('div',{class:'job-search-empty'},[text('Start typing to search — matches Job #, Client, or Project')]));
      return;
    }
    var matches = (state.allJobs || []).filter(function(j){
      return (j.jobNumber||'').toLowerCase().indexOf(query) !== -1
        || (j.jobNumberRaw||'').toLowerCase().indexOf(query) !== -1
        || (j.customer||'').toLowerCase().indexOf(query) !== -1
        || (j.project||'').toLowerCase().indexOf(query) !== -1;
    });
    if(!matches.length){
      resultsBox.appendChild(el('div',{class:'job-search-empty'},[text('No matching jobs found')]));
      return;
    }
    matches.slice(0,25).forEach(function(j){
      var row = el('div', {class:'job-search-row'});
      row.appendChild(el('div',{class:'job-search-row-id'},[text(j.jobNumber)]));
      row.appendChild(el('div',{class:'job-search-row-meta'},[text((j.customer||'—') + ' · ' + (j.project||'—'))]));
      row.addEventListener('click', function(){ onSelect(j.jobNumber); });
      resultsBox.appendChild(row);
    });
  }

  function renderWriteupView(root){
    var panel = el('div', {class:'panel'});
    ensureJobsLoaded();

    if(!state.writeupJob){
      var searchWrap = el('div', {class:'field'});
      searchWrap.appendChild(el('label',{},[text('Search Jobs')]));
      var searchInput = el('input', {type:'text', placeholder:'Type a Job #, Client, or Project — e.g. "REG" or "7547"'});
      searchInput.value = state.jobSearchQuery || '';
      var resultsBox = el('div', {class:'job-search-results', id:'job-search-results'});
      searchInput.addEventListener('input', function(){
        state.jobSearchQuery = searchInput.value;
        renderJobSearchResults(resultsBox, state.jobSearchQuery, loadJobForWriteup);
      });
      searchWrap.appendChild(searchInput);
      searchWrap.appendChild(resultsBox);
      panel.appendChild(searchWrap);
      renderJobSearchResults(resultsBox, state.jobSearchQuery, loadJobForWriteup);
    } else {
      var backBtn = el('button', {class:'btn secondary small'}, [text('← Search a different job')]);
      backBtn.style.marginBottom = '16px';
      backBtn.addEventListener('click', function(){
        state.writeupJob = null;
        state.writeupJobNumber = '';
        state.jobSearchQuery = '';
        state.writeupMsg = null;
        render();
      });
      panel.appendChild(backBtn);
    }

    if(state.writeupMsg) panel.appendChild(state.writeupMsg);

    if(state.writeupJob){
      var ref = el('div', {class:'refbox'});
      ref.appendChild(el('div',{class:'reftitle'},[text('Referencing: ' + state.writeupJobNumber)]));
      var grid = el('div', {class:'refgrid'});
      ['Client','Project'].forEach(function(k){
        grid.appendChild(el('div', {}, [el('span',{},[text(k)]), text(state.writeupJob[k] || '—')]));

      if(state.writeupWaterfall.length){
        var wsec = el('div', {class:'section'});
        wsec.appendChild(el('h2', {}, [text('Waterfall Actual Counts')]));
        state.writeupValues.waterfall = state.writeupValues.waterfall || {};
        state.writeupWaterfall.forEach(function(cat){
          var row = el('div', {class:'waterfallrow'});
          row.appendChild(el('div',{class:'catname'},[text(cat)]));
          var inp = el('input', {type:'text', placeholder:'Actual count'});
          inp.addEventListener('input', function(){ state.writeupValues.waterfall[cat] = inp.value; });
          row.appendChild(inp);
          wsec.appendChild(row);
        });
        panel.appendChild(wsec);
      }

      renderSchemaForm(panel, WRITEUP_STATIC, state.writeupValues);

      var actions = el('div', {class:'footer-actions'});
      var btn = el('button', {class:'btn'}, [text('Submit Writeup')]);
      btn.addEventListener('click', async function(){
        btn.disabled = true; btn.textContent = 'Saving...';
        try{
          var sections = buildSectionsPayload(WRITEUP_STATIC, state.writeupValues);
          if(state.writeupWaterfall.length){
            sections.unshift({
              section: 'Waterfall Actual Counts',
              fields: state.writeupWaterfall.map(function(cat){
                return { label: cat, value: (state.writeupValues.waterfall && state.writeupValues.waterfall[cat]) || '' };
              })
            });
          }
          var res = await callBackend('submitWriteup', { jobNumber: state.writeupJobNumber, sections: sections });
          state.writeupMsg = el('div', {class:'msg success'});
          state.writeupMsg.appendChild(text('Writeup saved. '));
          state.writeupMsg.appendChild(el('a', {href: res.url, target:'_blank'}, [text('Open in Google Sheets →')]));
          if(res.emailWarning){
            state.writeupMsg.appendChild(el('div', {style:'margin-top:8px;color:var(--warn);font-weight:600;'}, [text('Note: confirmation email failed to send — ' + res.emailWarning)]));
          }
        }catch(err){
          state.writeupMsg = el('div', {class:'msg error'}, [text(err.message)]);
        }
        render();
      });
      actions.appendChild(btn);
      panel.appendChild(actions);
    }
    root.appendChild(panel);
  }

  function render(){
    var scrollPos = window.scrollY;
    var root = document.getElementById('app');
    root.innerHTML = '';
    renderTopbar(root);
    renderFlow(root);
    if(!state.appsScriptUrl){
      var warn = el('div', {class:'msg error'}, [text('No Sheet backend connected yet — click "Connect Sheet" above to paste your Apps Script Web App URL.')]);
      warn.style.margin = '0 4px 16px';
      root.appendChild(warn);
    }
    if(state.view === 'dp') renderDpView(root);
    else if(state.view === 'review') renderReviewView(root);
    else renderWriteupView(root);
    window.scrollTo(0, scrollPos);
  }

  if(state.dpValues.audiences.length === 0) state.dpValues.audiences.push(newAudience());
  loadStoredUrl().then(render);
})();
</script>
